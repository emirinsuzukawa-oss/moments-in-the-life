<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="description" content="MOMENTS IN THE LIFE… 映画、ドラマ、CM、ファッション、美容、文化、旅行などを扱う独立系Webメディア。">
<title>MOMENTS IN THE LIFE… | Independent Media</title>

<style>
:root {
  --bg:#08090c;
  --panel:#14161d;
  --line:#35363d;
  --white:#f5f2ed;
  --muted:#aaa7a1;
  --gold:#c9a66b;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,"Noto Sans JP",sans-serif;
  line-height:1.85;
}
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }
button:focus-visible,a:focus-visible {
  outline:2px solid var(--gold);
  outline-offset:3px;
}
header {
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,9,12,.98);
  border-bottom:1px solid var(--line);
}
.brand {
  text-align:center;
  padding:22px 95px 10px;
  font-family:Georgia,serif;
  font-size:clamp(18px,3vw,32px);
  letter-spacing:.09em;
  line-height:1.3;
}
.gold { color:var(--gold); }
.subtitle {
  color:var(--muted);
  text-align:center;
  font-size:10px;
  letter-spacing:.22em;
  padding:0 12px 16px;
}
.language {
  position:absolute;
  top:19px;
  right:22px;
  display:flex;
  gap:5px;
}
.language button {
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  padding:5px 11px;
  font-size:12px;
}
.language button.selected {
  background:var(--gold);
  border-color:var(--gold);
  color:#08090c;
}
.tabs {
  display:flex;
  overflow-x:auto;
  scrollbar-width:thin;
  padding:0 14px;
  border-top:1px solid var(--line);
}
.tabs a {
  flex-shrink:0;
  padding:12px 15px;
  font-size:12px;
  color:var(--muted);
  border-bottom:2px solid transparent;
}
.tabs a:hover,.tabs a.active {
  color:var(--gold);
  border-bottom-color:var(--gold);
}
.layout {
  display:flex;
  min-height:75vh;
}
aside {
  width:225px;
  flex-shrink:0;
  padding:35px 18px;
  border-right:1px solid var(--line);
}
.side-label {
  color:var(--gold);
  font-size:11px;
  letter-spacing:.2em;
  padding:0 12px 15px;
}
aside a {
  display:block;
  padding:9px 12px;
  font-size:13px;
  color:var(--muted);
  border-left:2px solid transparent;
}
aside a:hover,aside a.active {
  color:var(--white);
  background:#1b1d23;
  border-left-color:var(--gold);
}
main {
  width:100%;
  min-width:0;
  padding:50px clamp(20px,5vw,85px) 90px;
}
.page { display:none; }
.page.active {
  display:block;
  animation:fade .3s ease;
}
@keyframes fade {
  from { opacity:0;transform:translateY(8px); }
  to { opacity:1;transform:translateY(0); }
}
.kicker {
  font-size:11px;
  color:var(--gold);
  letter-spacing:.25em;
  text-transform:uppercase;
}
h1,h2,h3 { font-weight:400; }
h1 {
  font-family:Georgia,"Noto Serif JP",serif;
  font-size:clamp(35px,5.5vw,70px);
  line-height:1.3;
  margin:22px 0;
}
h2 {
  font-family:Georgia,"Noto Serif JP",serif;
  font-size:clamp(25px,3.5vw,40px);
  line-height:1.4;
}
h3 {
  font-size:19px;
  color:var(--gold);
}
p { max-width:800px; }
.lead {
  font-size:17px;
  color:#e0dbd3;
}
.muted { color:var(--muted); }
.rule {
  height:1px;
  background:var(--line);
  margin:40px 0;
}
.hero {
  min-height:420px;
  border:1px solid var(--line);
  background:
    radial-gradient(ellipse at 80% 10%,#3b2b1b,transparent 50%),
    linear-gradient(135deg,#191b24,#08090c 75%);
  padding:clamp(25px,5vw,65px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.hero h1 {
  font-size:clamp(36px,6vw,80px);
}
.hero-sub {
  font-size:12px;
  letter-spacing:.15em;
  color:var(--muted);
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:30px;
}
.tile {
  min-height:155px;
  padding:22px;
  border:1px solid var(--line);
  background:linear-gradient(140deg,#1b1d25,#0b0c10);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.2s;
}
.tile:hover {
  border-color:var(--gold);
  transform:translateY(-3px);
}
.tile strong {
  font-size:18px;
  font-weight:400;
}
.tile small {
  color:var(--gold);
  letter-spacing:.12em;
  font-size:10px;
}
.coming {
  margin-top:35px;
  min-height:340px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#191b22,#090a0d);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}
.coming strong {
  font-family:Georgia,serif;
  font-size:clamp(28px,5vw,50px);
  font-weight:400;
  letter-spacing:.12em;
}
.coming span {
  color:var(--gold);
  font-size:11px;
  letter-spacing:.2em;
  margin-top:12px;
}
.back-link {
  display:inline-block;
  margin-top:28px;
  color:var(--gold);
  font-size:13px;
  border-bottom:1px solid var(--gold);
}
.policy-item {
  border-top:1px solid var(--line);
  padding:23px 0;
}
.policy-item h3 { margin:0 0 8px; }
.policy-item p { margin:0; }
.profile {
  display:grid;
  grid-template-columns:minmax(160px,260px) 1fr;
  gap:35px;
  margin-top:35px;
}
.profile img {
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border:1px solid var(--line);
}
.photo-note {
  color:var(--muted);
  font-size:12px;
}
footer {
  text-align:center;
  padding:40px 20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}
footer strong {
  font-family:Georgia,serif;
  font-size:19px;
  font-weight:400;
  color:var(--white);
}
@media(max-width:900px) {
  aside { width:170px;padding:25px 10px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:650px) {
  aside { display:none; }
  main { padding:35px 20px 65px; }
  .brand { padding:60px 10px 8px; }
  .language { top:14px;right:15px; }
  .subtitle { font-size:9px;letter-spacing:.12em; }
  .tabs { padding:0 5px; }
  .tabs a { padding:12px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .tile { min-height:120px;padding:15px; }
  .tile strong { font-size:15px; }
  .profile { grid-template-columns:1fr; }
  .profile img { max-width:260px; }
  .hero { min-height:340px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
